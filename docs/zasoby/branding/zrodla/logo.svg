<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-labelledby="tytul opis">
  <title id="tytul">RelAI</title>
  <desc id="opis">Kartka na pinezce z napisem RelAI i trzema kolorowymi pinezkami rejestrów.</desc>

  <defs>
    <style>/*{{FONTY}}*/
      .pis { font-family: 'Kalam', 'Segoe Script', 'Bradley Hand', cursive; }
      .ui  { font-family: 'Hanken Grotesk', 'Segoe UI', system-ui, -apple-system, sans-serif; }
    </style>
    <pattern id="kropki" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#d5c3a4" opacity=".5"/>
    </pattern>
    <filter id="cien" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#5a482c" flood-opacity=".18"/>
    </filter>
    <filter id="cien-s" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#5a482c" flood-opacity=".22"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="104" fill="#f2e9d8"/>
  <rect width="512" height="512" rx="104" fill="url(#kropki)"/>
  <circle cx="470" cy="60" r="110" fill="#c4643c" opacity=".07"/>
  <circle cx="52" cy="470" r="86" fill="#5f8a68" opacity=".08"/>

  <!-- taśma -->
  <g transform="rotate(-10 128 108)" opacity=".34">
    <rect x="66" y="90" width="124" height="34" rx="3" fill="#d9a134"/>
    <rect x="66" y="90" width="124" height="34" rx="3" fill="none" stroke="#b98a2c" stroke-width="1"/>
  </g>

  <!-- kartka -->
  <g transform="rotate(-3 256 268)">
    <rect x="66" y="128" width="380" height="280" rx="34" fill="#fffdf7" stroke="#e6d8bd" stroke-width="2" filter="url(#cien)"/>

    <text class="pis" x="256" y="272" font-size="94" font-weight="700" text-anchor="middle" fill="#312c25">Rel<tspan fill="#c4643c">AI</tspan></text>
    <path d="M 128 292 C 200 284 312 284 384 291" fill="none" stroke="#d9a134" stroke-width="7" stroke-linecap="round" opacity=".55"/>

    <!-- trzy rejestry jako pinezki -->
    <g>
      <circle cx="200" cy="344" r="11" fill="#c4643c"/>
      <circle cx="256" cy="344" r="11" fill="#d9a134"/>
      <circle cx="312" cy="344" r="11" fill="#5f8a68"/>
    </g>

    <!-- pinezka mocująca -->
    <g filter="url(#cien-s)">
      <circle cx="256" cy="134" r="18" fill="#c4643c"/>
      <circle cx="250" cy="128" r="6" fill="#e79a78" opacity=".9"/>
    </g>
  </g>
</svg>
