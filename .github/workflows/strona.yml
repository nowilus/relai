name: "Strona (GitHub Pages)"

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/strona.yml"
      - ".claude-plugin/marketplace.json"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  buduj:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Ustaw Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Fakty
        run: node site/narzedzia/fakty.mjs
      - name: Makiety
        run: node site/narzedzia/makiety.mjs
      - name: Zbuduj
        run: node site/narzedzia/zbuduj.mjs
      - name: Testy
        run: node --test "site/**/*.test.mjs"
      - name: Skonfiguruj Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Wyslij artefakt
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  publikuj:
    needs: buduj
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publikuj na GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
